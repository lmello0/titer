#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: titer

  datasource:
    url: jdbc:postgresql://localhost:5432/titer
    username: titer_user
    password: titer_admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

  web:
    error:
      whitelabel:
        enabled: false

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

app:
  security:
    jwt:
      secret: "w6MG6ScHfY6GYVNgyTd1pnbaZzH/Wn/akM0EPn7/I14="
      expiration-seconds: 86_400
      issuer: "titer-backend-eefbd064-569b-428c-a68c-bd7d94b7be64"

  storage:
    base-url: http://localhost:8080/files
    provider:
      default-provider: s3

    local:
      enabled: false
      root-path: ./uploads

    s3:
      enabled: true
      bucket: titer-bucket

aws:
  region: us-east-1
  endpoint-url: "http://localhost:4566"
  path-style-access-enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith,flyway

logging:
  level:
    com.lmello.titer.storage: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE