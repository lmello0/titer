#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: titer

  datasource:
    url: ${DB_ADMIN}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true

  web:
    error:
      whitelabel:
        enabled: false

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

app:
  auth:
    cors:
      allowed-origins:
        - "http://localhost:5500"
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      access-token-ttl: 5m
      refresh-token-ttl: 1h
    social:
      google:
        client-ids: ${GOOGLE_CLIENT_IDS}
  storage:
    base-url: http://localhost:8080/files
    provider:
      default-provider: s3
    local:
      enabled: false
      root-path: ./uploads
    s3:
      enabled: true
      bucket: titer-bucket
  users:
    email-verification:
      ttl: 24h

aws:
  region: us-east-1
  endpoint-url: "http://localhost:4566"
  path-style-access-enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith,flyway

logging:
  level:
    com.lmello.titer.storage: DEBUG
#    org.hibernate.orm.jdbc.bind: TRACE